/* 备用第 8 篇：马斯克 INTP/INTJ 争议（坐标演示口径）。

const NOTE_ELON = {
  no: 31,
  coverLines: ['两边都有道理', '他卡在中间'], coverHighlight: '中间',
  scene: '网上吵了很久：他到底是 INTP 还是 INTJ？两边都能举出一堆公开言行。',
  sceneNote: '这不是给他贴标签，是一次坐标演示：看看中间那一档长什么样。',
  signs: [

  question: {
    label: '40q-v1 · P_J 维度 · 原题 #51',
    left: '我凡事喜欢提前制定计划并按时完成，拖延会让我感到焦虑。',

};

const NOTE_LIBRARY = {
  day1: NOTE_DAY1, day2: NOTE_DAY2, day3: NOTE_DAY3, day4: NOTE_DAY4,
  day5: NOTE_DAY5, day6: NOTE_DAY6, day7: NOTE_DAY7,
  elon: NOTE_ELON
};
const pick = window.__NOTE_OVERRIDE || new URLSearchParams(location.search).get('note') || 'day1';
const NOTE = NOTE_LIBRARY[pick] || NOTE_LIBRARY.day1;

/* 人物按「新坐标」查表。全部为虚构角色：只用文字提及名字与作品名，
   不放立绘/剧照/AI 仿图，不引用受版权保护的台词，不虚构授权或背书。
   不是产品结果页的档案代表人物（FEATURED_PROFILES / CELEBRITY_MAP 仍是历史人物）。 */
const PERSONS = {
  ENFP: { name: '漩涡鸣人', field: '《火影忍者》主角', story: '从小被村里孤立，却天天喊着要成为火影；把每个被丢下的人都一个个拉回来。', link: '不是不靠谱，是把所有人都算进了自己的计划。' },
  ENTD: { name: '托尼·斯塔克', field: '漫威 / 钢铁侠', story: '从武器商人到造出战甲，想的永远是还没存在的东西；方案一旦不成立，当场推翻重做。', link: '想得远，也肯把刚定的方案当场推翻。' },
  INFJ: { name: '宇智波鼬', field: '《火影忍者》角色', story: '在家族与村子之间做取舍，很少解释自己，却早早把很多步之后的事都安排好了。', link: '很少解释，不代表心里没有要守的东西。' },
  ESFP: { name: '路飞', field: '《海贼王》主角', story: '为成为海贼王出海，靠身体和当下直觉一路往前；伙伴有难就立刻掉头，从不先算代价。', link: '不先算代价，不代表不知道自己要什么。' },
  ENTJ: { name: '江户川柯南', field: '《名侦探柯南》主角', story: '高中生侦探工藤新一被卷入事件后身体缩小，仍靠碎片证据一步步把真相收网。', link: '线索越碎，他越能先看到整张图。' },
  INTP: { name: 'L', field: '《死亡笔记》角色', story: '几乎不露面，靠抽象假设和概率推演逼近真相；作息与办案方式都异于常人。', link: '不按常理，但每一步都是算出来的。' },
  ESTJ: { name: '赫敏·格兰杰', field: '《哈利·波特》角色', story: '把课本、规则和复习计划都安排得清清楚楚，靠可验证的事实把朋友一次次拉出麻烦。', link: '先把规则理清，再把人带出去。' },

};
const person = PERSONS[NOTE.result.code] || { name: '—', field: '', story: '该坐标的人物见审核台。', link: '一个一眼能认出的人，比坐标更好记。' };
const personTag = '流行参照 / POP REFERENCE';
const personFoot = '虚构角色 · 仅作性格类比<br>与作品版权方无关联 · 非官方';

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const no2 = String(NOTE.no).padStart(2, '0');
const LABELS = ['COVER', 'SCENE', 'SIGN', 'SIGN', 'SIGN', 'COORDINATE', 'QUESTION', 'RESULT', 'NOTE'];

const shell = (inner, n) => `<section class="page">
  <div class="head mono">
    <span class="h-l">MBTI — PRO</span>
    <span>PERSONALITY ARCHIVE / ${LABELS[n - 1]}</span>
    <span class="h-r">${String(n).padStart(2, '0')} / 09</span>
  </div>
  <div class="eyebrow mono">${String(n).padStart(2, '0')} / ${LABELS[n - 1]}</div>
  ${inner}
  <div class="footer mono"><span>81-TYPE PERSONALITY ARCHIVE</span><span>NO.${no2}</span></div>
</section>`;

const hlLine = t => t.includes(NOTE.coverHighlight)
  ? '<span class="hl">' + esc(t) + '</span>' : esc(t);

const p1 = `<div class="p1" style="position:absolute;inset:0">
  <div class="cover-title serif">${NOTE.coverLines.map(hlLine).join('<br>')}</div>

  <div class="person-link">${esc(person.link)}</div>
</div>`;

const p2 = `<div class="p2" style="position:absolute;inset:0">

  <div class="scene serif">${esc(NOTE.scene)}</div>
  <div class="note">${esc(NOTE.sceneNote)}</div>
</div>`;

const signs = NOTE.signs.map((s, i) => `<div class="sign" style="position:absolute;inset:0">
  <div class="idx serif">${String(i + 1).padStart(2, '0')}</div>
  <div class="bar"></div>
  <div class="title serif">${esc(s.title)}</div>
  <div class="desc">${esc(s.desc)}</div>
</div>`);

const p6 = `<div class="p6" style="position:absolute;inset:0">

</div>`;

const nameLen = [...person.name].length;

const p8 = `<div class="p8" style="position:absolute;inset:0">
  <div class="hook serif">${esc(person.link)}</div>
  <div class="type-tag">${esc(NOTE.result.code)} / ${esc(NOTE.result.name)}</div>
  <div class="group"><span class="swatch" style="background:${esc(NOTE.result.color || '#8B95A0')}"></span>${esc(NOTE.result.group)}</div>

    <div class="c-no mono">POP REFERENCE / 01</div>
    <div class="c-name serif${nameCls}">${esc(person.name)}</div>
    <div class="c-field">${esc(person.field)}</div>
    <div class="c-rule"></div>
    <div class="c-story">${esc(person.story)}</div>
    <div class="c-foot mono">${personFoot}</div>
  </div>
</div>`;

const p9 = `<div class="p9" style="position:absolute;inset:0">

document.getElementById('root').innerHTML = [
  shell(p1, 1), shell(p2, 2), ...signs.map((s, i) => shell(s, i + 3)),

].join('');
</script>
