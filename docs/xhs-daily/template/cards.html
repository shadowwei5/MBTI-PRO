<style>

* { margin:0; padding:0; box-sizing:border-box; }

.page { width:1080px; height:1440px; background:var(--paper); position:relative; overflow:hidden;

.head { position:absolute; top:56px; left:96px; right:96px; display:flex; justify-content:space-between;

.p1 .cover-name { line-height:1; color:var(--accent); letter-spacing:.01em; font-weight:500; }
.p1 .person-alias { position:absolute; left:96px; top:430px; font-size:24px; letter-spacing:.05em;
  color:var(--ink); font-weight:500; }
/* 有别名行时，作品行下移，避免与别名重叠 */

.p1 .person-work { position:absolute; left:96px; top:468px; font-size:22px; letter-spacing:.14em;

.p1 .cover-title { position:absolute; left:96px; top:518px; font-size:78px; line-height:1.52; font-weight:500; }

.p1 .dtag b { color:var(--accent); font-weight:500; }

.p1.poster { background:#EAF2FB; }        /* 浅蓝底：与信息流米白背景拉开，缩略图更跳 */

.p1.poster .poster-title .hl { background:linear-gradient(transparent 60%, #FFE96B 60%); color:#A63D2C; }

/* 结果卡下方的「你可能是」提示条，填满中部并强化对号入座 */
.p1.poster .poster-note { position:absolute; left:86px; top:876px; width:908px; padding:26px 30px;

.p1.poster .poster-foot::before { content:"→ "; color:#2C6FB5; font-weight:700; }
/* 海报封面底部补一条浅色条，压住下缘空白 */

/* 封面图标（CSS/SVG 手绘）：铺满方框、居中 */

.p7 .scale { position:absolute; left:96px; right:96px; top:820px; display:flex; }

.p7.has-quiz3 .q-title { top:252px; font-size:56px; }

.p7.has-quiz3 .qz-head span:last-child { color:var(--muted); font-size:17px; }
.p7.has-quiz3 .qwrap { position:static; height:auto; display:flex;
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.p7.has-quiz3 .qcol { flex:1; position:relative; padding:46px 30px 18px; font-size:25px; line-height:1.6; }
.p7.has-quiz3 .qcol small { position:absolute; top:14px; left:30px; font-size:16px; letter-spacing:.12em; }
.p7.has-quiz3 .scale { top:1024px; }
.p7.has-quiz3 .qfoot { top:1104px; font-size:22px; }
.p7.has-quiz3 .shot { display:none; }
.p7.has-quiz3 .shot-cap { display:none; }
/* 真实界面带：直接画四维坐标条（不用截图，避免价格/链接风险，也比缩略图看得清） */
.p7 .shot { position:absolute; left:96px; top:948px; width:888px; height:238px;
  border:1px solid var(--rule); background:var(--paper-light); padding:18px 26px 0; }
.p7 .shot .cs-head { display:flex; justify-content:space-between; align-items:baseline;

.p7 .shot .cs-row .cs-pole { font-size:24px; color:var(--ink); font-weight:500; width:26px; text-align:center; }

.p7 .shot .cs-row .cs-line { flex:1; height:1px; background:var(--rule); position:relative; margin:0 8px; }

.p7 .shot-cap { position:absolute; left:96px; top:1188px; font-size:18px; letter-spacing:.1em;
  color:var(--muted); font-family:'DM Mono','Consolas',monospace; }

.p8 .hook { position:absolute; left:96px; top:300px; width:490px; font-size:60px; line-height:1.65; font-weight:500; }
.p8 .type-tag { position:absolute; left:96px; top:720px; font-size:22px; letter-spacing:.14em;
  color:var(--accent); font-family:'DM Mono','Consolas',monospace; }
.p8 .dispute { position:absolute; left:96px; top:754px; font-size:19px; letter-spacing:.08em;
  color:var(--accent); }

/* 人格画像：81 型专属插画，放在卡片标题下、剧情之上 */

<body>
<div id="root"></div>
<script>
/* 数据段由 scripts/xhs-daily/build-week.mjs 注入（源文件 scripts/xhs-daily/notes-data.mjs）。
   手改本段会被下次构建覆盖；要改内容请改 notes-data.mjs，再跑：
     node scripts/xhs-daily/build-week.mjs
     node scripts/xhs-daily/render-cards.mjs --all
     node scripts/xhs-daily/build-review.mjs
   预览：cards.html?note=day1 … day7
   排期口径（2026-11-12 21:10）：7 天坐标落在特质最鲜明的端值组合；
   每人只在「一个维度」上设争议点，用这个争议引出 81 型的中间档（A/B/C/D）。
   四维口径（types.ts）：E 外向 / A 平衡 / I 内向；S 实感 / B 均衡 / N 直觉；
   T 思考 / C 复合 / F 情感；J 判断 / D 动态 / P 感知。
   光谱落点：E/S/T/J = 12（左端），I/N/F/P = 88（右端），A/B/C/D = 50。
   人物只是「一眼认出」的参照，不是产品结果页的档案代表人物；只用文字提及，不放立绘/剧照/照片。 */
/* ==== NOTES:BEGIN ==== */
const DISCLAIMER = "本内容仅供自我探索与娱乐参考，不构成心理诊断、医疗建议或招聘依据。\nMBTI-PRO 与 MBTI 官方机构无关联。";
const NOTE_LIBRARY = {
  "day1": {
    "key": "day1",
    "no": 1,
    "person": {
      "name": "鸣人",
      "coverName": "漩涡鸣人",
      "work": "《火影忍者》",
      "field": "主角",
      "story": "从小被村里孤立，却天天喊着要成为火影；把每个被丢下的人都一个个拉回来。",
      "link": "不是不靠谱，是把所有人都算进了自己的计划。"
    },
    "coverLines": [

    <div class="qcol serif${NOTE.question.left.length > 28 ? ' tight' : ''}"><small class="mono">A · 正方</small>${esc(NOTE.question.left)}</div>
    <div class="qcol serif${NOTE.question.right.length > 28 ? ' tight' : ''}"><small class="mono">C · 反方</small>${esc(NOTE.question.right)}</div>
  </div>`}
  <div class="scale mono"><div>选 <b>A</b> 偏正方</div><div>选 <b>B</b> 两边都像</div><div>选 <b>C</b> 偏反方</div><div class="scale-tip">← 记住你的 3 个字母</div></div>
  <div class="qfoot">${esc(NOTE.question.foot)} · 读两段描述，没有标准答案。</div>
  ${SHOW_COORD && !NOTE.quiz3 ? `<div class="shot">
    <div class="cs-head mono"><span>YOUR COORDINATE</span><span>81 TYPES</span></div>
    ${NOTE.dims.map((d) => {
      const poles = d.v.split(' / ');
      const seg = poles.map((p, pi) =>
        `<span class="cs-pole${p === d.letter ? ' is-hot' : ''}">${esc(p)}</span>` +
        (pi < poles.length - 1 ? '<span class="cs-line"><i></i></span>' : '')
      ).join('');
      return `<div class="cs-row"><span class="cs-k">${esc(d.k)}</span>${seg}</div>`;
    }).join('')}
  </div>
  <div class="shot-cap">↑ 产品里的四个维度，<b>红色是这一型落的位置</b></div>` : ''}
</div>`;

const nameLen = [...NOTE.person.name].length;
const nameCls = nameLen <= 3 ? '' : (nameLen <= 5 ? ' mid' : ' long');
// 剧情文字按长度分档缩字号：卡片底部空间固定，最长的一篇（柯南 41 字）不降档会压到下面的类型码与免责
const storyLen = [...(NOTE.person.story || '')].length;
const storyCls = storyLen > 40 ? ' s' : (storyLen > 36 ? ' m' : '');
const p8 = `<div class="p8" style="position:absolute;inset:0">
  <div class="hook serif">${nl(D.punch)}</div>
  <div class="type-tag">${esc(NOTE.result.code)} / ${esc(NOTE.result.name)}</div>
  <div class="dispute mono">争议维 ${esc(D.dimNo)} ${esc(D.dimName)} · ${esc(D.scale)}</div>
  <div class="group"><span class="swatch" style="background:${esc(NOTE.result.color || '#8B95A0')}"></span>${esc(NOTE.result.group)}</div>
  <div class="card">
    <div class="c-no mono">POP REFERENCE / 01</div>
    ${NOTE.result.code ? `<div class="c-portrait"><img src="${esc(PORTRAIT_BASE)}${esc(NOTE.result.code)}.jpg" alt=""></div>
    <div class="c-portrait-cap mono">↑ ${esc(NOTE.result.code)} 这一型的人格画像 · 非角色本人</div>` : ''}
    <div class="c-code mono">${esc(NOTE.result.code)} · ${esc(NOTE.result.name)}</div>
    <div class="c-work">${esc(NOTE.person.work || '')}</div>
    <div class="c-name serif${nameCls}">${esc(NOTE.person.name)}</div>
    <div class="c-field">${esc(NOTE.person.field)}</div>
    <div class="c-rule"></div>
    <div class="c-story${storyCls}">${esc(NOTE.person.story)}</div>
    <div class="c-foot mono">${NOTE.person.fictionNote ? NOTE.person.fictionNote.replace(/&lt;br&gt;/g, '<br>').replace(/<br>/g, '<br>') : '虚构角色 · 仅作性格类比<br>与作品版权方无关联 · 非官方'}</div>
  </div>
</div>`;

// P9 三选一投票框：只有 NOTE.vote 存在时才渲染（数据驱动，避免每篇硬套 J/D/P）
const vote = Array.isArray(NOTE.vote) && NOTE.vote.length === 3
  ? `<div class="vote">${NOTE.vote.map((v, i) =>
      `<div class="vc${i === 1 ? ' mid' : ''}"><b class="mono">${esc(v.k)}</b><span>${nl(v.d)}</span></div>`
    ).join('')}</div>`
  : '';

const p9 = `<div class="p9${vote ? ' has-vote' : ''}" style="position:absolute;inset:0">
  <div class="cta serif">${nl(NOTE.cta || '')}</div>
  ${vote}
  <div class="ask">打出你的 <b>3 个字母</b>，再 <b>@点点</b> 拿专属分析</div>
  <div class="ask-why">（别人打「ca b c」都能收到她的回复，你也可以）</div>
  <div class="hint">${esc(NOTE.hint)}</div>
  <div class="disc">${nl(DISCLAIMER)}</div>
  <div class="endbar"></div>
</div>`;

document.getElementById('root').innerHTML = [
  // 7 图结构（2026-11-17 调研结论：爆款是 6-7 张，且题目必须在 P2 就让读者当场能做）
  // P1 封面 → P2 当场做题 → P3/P4 两侧证据 → P5 结论 → P6 结果卡 → P7 @点点互动
  shell(p1, 1), shell(p7, 2), ...signs.slice(0, 2).map((s, i) => shell(s, i + 3)),
  shell(p6, 5), shell(p8, 6), shell(p9, 7)
].join('');
</script>
</body>
</html>
