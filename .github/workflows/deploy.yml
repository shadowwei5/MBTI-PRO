name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tencent-cloud-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH

            cd /opt/MBTI-PRO

            git fetch origin master
            git reset --hard origin/master

            touch server/.env
            sed -i '/^ADMIN_KEY=/d;/^CLIENT_ORIGIN=/d;/^XORPAY_/d;/^SMTP_/d' server/.env
            cat >> server/.env << 'ENVEOF'
            ADMIN_KEY=${{ secrets.ADMIN_KEY }}
            CLIENT_ORIGIN=https://mbti-pro.com
            ENVEOF

            cd server
            server_hash="$(sha256sum package.json package-lock.json | sha256sum | awk '{print $1}')"
            if [ ! -d node_modules ] || [ ! -f .deploy_lock_hash ] || [ "$(cat .deploy_lock_hash)" != "$server_hash" ]; then
              npm install --include=dev --prefer-offline --no-audit
              echo "$server_hash" > .deploy_lock_hash
            fi
            npx prisma generate
            npx prisma db push
            npx tsx scripts/fix-names.ts

            cd ../client
            client_hash="$(sha256sum package.json package-lock.json | sha256sum | awk '{print $1}')"
            if [ ! -d node_modules ] || [ ! -f .deploy_lock_hash ] || [ "$(cat .deploy_lock_hash)" != "$client_hash" ]; then
              npm install --prefer-offline --no-audit
              echo "$client_hash" > .deploy_lock_hash
            fi
            npm run build

            systemctl restart mbti-pro
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:3001/api/health >/dev/null && break
              sleep 1
              if [ "$i" = "30" ]; then
                journalctl -u mbti-pro -n 80 --no-pager || true
                exit 1
              fi
            done
            curl -fsS -H 'Host: mbti-pro.com' -o /dev/null http://127.0.0.1/ && echo "Deploy done"
